name: Rebuild detail + list pages (commit back)

# Nightly + on-demand: regenerate everything generate-details.mjs owns —
#   * detail pages   community / floor-plan / QMI / blog (plus the HOA-link and
#                    /pdf-features/ link refresh baked into the generator)
#   * list pages     /new-homes/available/, /new-homes/<city>/available-homes/ and the
#                    /new-homes/available/filter/<hash>/ saved searches (render-lists.mjs)
#   * promo copy     public/live-facts.json badges + the site-wide dead-promo-ribbon sweep
# and COMMIT the result to main, so the committed public/ mirror never drifts from live
# D1 again. Pushes made with GITHUB_TOKEN do NOT trigger deploy.yml (GitHub suppresses
# workflow runs from Actions-token pushes), so we dispatch it explicitly after the push.
# deploy.yml also regenerates at deploy time, but never commits — this workflow is what
# keeps the repo itself fresh.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *" # 08:30 UTC, ahead of deploy.yml's 09:00 nightly

concurrency:
  group: rebuild-details
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # dispatch deploy.yml after the commit-back push
  issues: write # open/update the tracking issue when a run fails

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Zero npm deps — npm ci is a no-op guard in case deps ever appear.
      - run: npm ci --ignore-scripts || true

      # Same regression self-tests deploy.yml gates on — a render-source regression must
      # not be committed back into main.
      - name: Regression self-tests (scrape-free)
        run: npm run --if-present check:render

      - name: Rebuild detail + list pages from the live API (scrape-free)
        run: node generate-details.mjs

      # Keep the COMMITTED blog search index converged too. deploy.yml regenerates this
      # for the shipped artifact, but that bake is never committed, so without this step
      # the committed index would stay stale and every deploy would rediscover the same
      # diff from scratch — the same shape as the prune count that never reset because the
      # commit-back lagged. `git add -A` below picks it up.
      - name: Regenerate the blog search index from the baked posts
        run: node scripts/gen-blog-index.mjs

      - name: Commit & push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — public/ already matches live D1."
            exit 0
          fi
          git config user.name "esperanza-rebuild-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Nightly detail + list page rebuild from live API"
          git push origin main
          # GITHUB_TOKEN pushes never fire push-triggered workflows — deploy explicitly.
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      # Nothing surfaced a failed nightly run before this. GitHub's only default signal for
      # a failed cron is an email to whoever last edited the schedule — one person, easy to
      # miss. A silent failure here is the worst case in the pipeline: Cloudflare keeps
      # serving the last good deploy, so the site looks fine while every subsequent data fix
      # stops reaching production. Surface the freeze in the repo instead of one inbox.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "CI failure: nightly rebuild/deploy is not reaching production"
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/ci-failure-body.md"
          {
            echo "\`$WORKFLOW\` failed on \`$REF\`: $RUN_URL"
            echo
            echo "**The site is not down — it is frozen.** Cloudflare keeps serving the last"
            echo "successful deploy, so nothing looks broken, but no data or content fix"
            echo "reaches production until this workflow is green again."
            echo
            echo "The most common cause is the stale-QMI prune backstop in"
            echo "\`generate-details.mjs\` after a bulk unpublish: it refuses more than 50"
            echo "newly-stale detail pages in one run, or a jump past 3x the prior run's"
            echo "count. Search the run log for \`stale QMI prune:\`."
            echo
            echo "- Deletions intended and reviewed -> re-run with \`ESP_ALLOW_BULK_PRUNE=1\`."
            echo "- Otherwise -> unpublish in smaller batches; do not raise the backstop."
          } > "$BODY"
          NUM="$(gh issue list --state open --limit 100 --json number,title \
                   --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY"
            echo "Appended to existing tracking issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi
